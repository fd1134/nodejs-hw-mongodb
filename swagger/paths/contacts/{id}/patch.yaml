patch:
  tags:
    - Contacts
  summary: Update contact by id
  operationId: updateContact
  description: Update one or more fields of a contact by their ID.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        example: '65ca67e7ae7f10c88b598384'
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              description: "Contact's name"
              type: string
              example: 'John Doe'
            phoneNumber:
              description: "Contact's phone number"
              type: string
              example: '+1234567890'
            contactType:
              description: "Type of contact"
              type: string
              enum: ['work', 'home', 'personal']
              example: 'personal'
            userId:
              description: "User's id"
              type: string
              example: '65e4decdd286b30065d54af9'
            isFavorite:
              description: "Is contact a favorite"
              type: boolean
              example: true
            photo:
              description: "Contact's photo"
              type: string
              format: binary
  responses:
    '200':
      description: Contact updated successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
              data:
                $ref: ../../components/schemas/contact.yaml
    '401':
      $ref: '../../components/responses/401.yaml'
    '404':
      description: Contact not found