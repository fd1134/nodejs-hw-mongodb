tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
         - "name"
         - "phoneNumber"
         - "contactType"
         - "userId"
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+1234567890'
          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          userId:
            description: "User's id"
            type: string
            example: '65e4decdd286b30065d54af9'          
          isFavorite:
            description: "Is contact a favorite"
            type: boolean
            example: true               
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'