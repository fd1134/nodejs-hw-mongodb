tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Retrieve a list of all contacts.'
security:
  - bearerAuth: []
parameters: 
  - name: page
    in: query
    description: 'Page number for pagination'
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    description: 'Number of contacts to retrieve per page'
    required: false
    schema:
      type: integer
      default: 10
  - name: sortBy
    in: query
    description: 'Field to sort contacts by'
    required: false
    schema:
      type: string
      enum: ['name', 'phoneNumber', 'email']
      default: 'name'
  - name: sortOrder
    in: query
    description: 'Order to sort contacts by'
    required: false
    schema:
      type: string
      enum: ['asc', 'desc']
      default: 'asc'
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'